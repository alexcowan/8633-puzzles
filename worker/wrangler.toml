name = "cwg-grader"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Pages origins allowed to call the grader. Add http://localhost:8000 while testing locally.
[vars]
ALLOWED_ORIGINS = "https://alexcowan.github.io"

# Per-IP backstop: 300 requests per minute. A classroom shares one IP, so this is a room-sized limit.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 300, period = 60 }

# D1 holds the Terms comments and the grading record. Create it once with
#   npx wrangler d1 create cwg
# put the id it prints below, then: npx wrangler d1 migrations apply cwg --remote
[[d1_databases]]
binding = "DB"
database_name = "cwg"
database_id = "REPLACE_WITH_D1_ID"
migrations_dir = "migrations"

# The old home of the Terms comments. The worker copies each term's comments into D1 the first time
# that term is read; after that this binding is only a fallback and can be removed.
[[kv_namespaces]]
binding = "COMMENTS"
id = "c4f1c5de74ca47e98682fa0e21095e3b"

# Secrets are set with `wrangler secret put`, never written here:
#   ANTHROPIC_API_KEY   the key from the cwg-grader workspace
#   CLASS_CODE          the code students enter (rotate each term)
#   INSTRUCTOR_CODE     lets the instructor delete comments on the Terms page and read the grading record (stats.html)
