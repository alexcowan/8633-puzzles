name: Deploy grader
# Deploys worker/ to Cloudflare whenever it changes on main, after the worker tests pass.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   a token with "Edit Cloudflare Workers" and D1 edit permissions
#   CLOUDFLARE_ACCOUNT_ID  from the Cloudflare dashboard sidebar
# Without them the job runs the tests and skips the deploy.
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-worker
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run test:worker
      - name: Apply database migrations
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker
        run: npx wrangler d1 migrations apply cwg --remote
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker
        run: npx wrangler deploy
      - name: Deploy skipped
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN isn't set, so the grader was tested but not deployed."
